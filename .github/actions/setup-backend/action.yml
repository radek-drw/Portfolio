name: Setup Backend
description: Install deps and build lambda

runs:
  using: 'composite'
  steps:
    - name: Enable pnpm
      run: corepack enable
      shell: bash

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.13.0
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter backend
      shell: bash

    - name: Build lambda
      run: pnpm --filter backend run build:lambda contact-form
      shell: bash
