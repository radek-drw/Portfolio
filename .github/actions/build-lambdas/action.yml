name: Build Lambdas
description: Install backend dependencies and build Lambdas

runs:
  using: 'composite'
  steps:
    - name: Enable pnpm
      run: corepack enable
      shell: bash

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24.13.0
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    - name: Install dependencies
      run: pnpm install --frozen-lockfile --filter backend
      shell: bash
      env:
        CI: true

    - name: Build Lambdas
      run: pnpm --filter backend run build:lambda
      shell: bash
