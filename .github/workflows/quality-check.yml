name: Quality Check

on:
  push:
    branches:
      - dev

  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  quality-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Node version before
        run: node --version

      - name: Corepack version
        run: corepack --version

      - name: Enable pnpm
        run: corepack enable

      - name: PNPM version
        run: pnpm --version

      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Node version after
        run: node --version

      - name: Corepack version
        run: corepack --version

      - name: PNPM version
        run: pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter .
        env:
          CI: true

      - name: PNPM version
        run: pnpm --version

      - name: Static code analysis (ESLint)
        run: pnpm run lint --if-present

      - name: Check code formatting (Prettier)
        run: pnpm run format:check --if-present
