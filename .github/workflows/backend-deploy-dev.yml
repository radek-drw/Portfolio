name: Backend Deploy (DEV)

on:
  push:
    branches:
      - dev
    paths:
      - 'backend/src/**'
      - 'backend/package.json'
      - 'backend/scripts/build-lambda.js'
      - '!backend/**/*.md'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write

jobs:
  deploy-lambda:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter backend
        shell: bash
        env:
          CI: true

      - name: Build lambda
        run: pnpm --filter backend run build:lambda send-email
        shell: bash

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/dev-github-actions-lambda-deploy-role
          aws-region: eu-west-1

      - name: Deploy all Lambdas
        run: |
          for zip in backend/dist/*.zip; do
            lambda_name=$(basename "$zip" .zip)
            aws_name="dev-${lambda_name}-lambda"

            echo "🚀 Deploying $lambda_name..."
            echo "   AWS Lambda: $aws_name"
            echo "   Artifact: $zip"

            aws lambda update-function-code \
              --function-name "$aws_name" \
              --zip-file "fileb://$zip"

            echo "✅ Deployed $lambda_name"
          done
