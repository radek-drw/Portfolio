name: Terraform Deploy (PROD)

on:
  push:
    branches:
      - main
    paths:
      - 'infra/**'
      - '!infra/envs/dev/**'
      - 'backend/src/**'
      - 'backend/package.json'
      - 'pnpm-lock.yaml'
      - 'backend/scripts/build-lambda.js'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  # --- Terraform Quality Checks ---
  terraform-quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra

      - name: Validate Terraform
        working-directory: infra/envs/prod
        run: terraform init -backend=false && terraform validate

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v6
        with:
          tflint_version: v0.64.0
          cache: true
          tflint_config_path: '**/.tflint.hcl'

      - name: Init TFLint
        working-directory: infra
        run: tflint --init

      - name: Lint Terraform envs
        working-directory: infra/envs
        run: tflint --recursive -f compact --config "$GITHUB_WORKSPACE/infra/.tflint.hcl"

      - name: Lint Terraform modules
        working-directory: infra/modules
        run: tflint --recursive -f compact --config "$GITHUB_WORKSPACE/infra/modules/.tflint.hcl"

      - name: Lint Terraform stacks
        working-directory: infra/stacks
        run: tflint --recursive -f compact --config "$GITHUB_WORKSPACE/infra/stacks/.tflint.hcl"

  # --- Code Quality Checks ---
  code-quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Code Quality Checks
        uses: ./.github/actions/code-quality

  # --- Terraform Plan ---
  terraform-plan:
    needs:
      - terraform-quality-check
      - code-quality-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0

      - name: Build Lambdas
        uses: ./.github/actions/build-lambdas

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/prod-github-actions-terraform-role
          aws-region: eu-west-1

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v7
        with:
          name: prod-tfplan
          path: infra/envs/prod/tfplan
          if-no-files-found: error
          retention-days: 1

  # --- Deployment ---
  deploy-terraform:
    environment: production
    needs:
      - terraform-plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/prod
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0

      - name: Build Lambdas
        uses: ./.github/actions/build-lambdas

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/prod-github-actions-terraform-role
          aws-region: eu-west-1

      - name: Terraform Init
        run: terraform init

      - name: Download Terraform Plan
        uses: actions/download-artifact@v8
        with:
          name: prod-tfplan
          path: infra/envs/prod

      - name: Terraform Apply
        run: terraform apply tfplan
