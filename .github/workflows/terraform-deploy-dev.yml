name: Terraform Deploy (DEV)

on:
  push:
    branches:
      - dev
    paths:
      - 'infra/**'
      - 'backend/src/**'
      - 'backend/package.json'
      - 'pnpm-lock.yaml'
      - 'backend/scripts/build-lambda.js'
      - '!backend/**/*.md'

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy-terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/envs/dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Lambdas
        uses: ./.github/actions/build-lambdas

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.14.0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/dev-github-actions-terraform-role
          aws-region: eu-west-1

      - name: Terraform Detach Lambda IAM Policy
        run: terraform destroy -target=module.contact_form.module.iam.aws_iam_role_policy_attachment.this -auto-approve

      - name: Terraform Destroy Lambda IAM Role
        run: terraform destroy -target=module.contact_form.module.iam.aws_iam_role.this -auto-approve
