name: Build Frontend

on:
  push:
    branches:
      - dev
    paths:
      - 'frontend/**'
    paths-ignore:
      - 'frontend/**/*.md'
      - 'frontend/**/*.test.*'
      - 'frontend/**/*.spec.*'

  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
    paths-ignore:
      - 'frontend/**/*.md'
      - 'frontend/**/*.test.*'
      - 'frontend/**/*.spec.*'
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Enable pnpm
        run: corepack enable

      - uses: actions/setup-node@v6
        with:
          node-version: 24.13.0
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter frontend

      - name: Build frontend
        run: pnpm --filter frontend run build
        env:
          CI: true
